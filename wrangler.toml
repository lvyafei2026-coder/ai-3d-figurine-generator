name = "ai-3d-figurine-generator"
main = "src/index.js"
compatibility_date = "2026-09-27"

[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "none"
run_worker_first = ["/*"]

[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1010"
simple = { limit = 5, period = 60 }

[[kv_namespaces]]
binding = "QUOTA_KV"
id = "6ada6a3ea5e549c3962bc55e6a8463bb"

[observability.logs]
enabled = true
invocation_logs = true